# Interlock: `docker compose up -d`, then http://localhost:52773/interlock/index.html (operator / interlock).
# The base image is the contest's irishealth-community:2026.3.0AI.154.0; see the README to load and tag it.
services:
  interlock:
    build:
      context: .
      args:
        IRIS_IMAGE: ${INTERLOCK_IMAGE:-irishealth-community:2026.3.0AI.154.0}
        # Password of the demo users operator, approver and wards-client, set when the image is built.
        INTERLOCK_DEMO_PASSWORD: ${INTERLOCK_DEMO_PASSWORD:-interlock}
    image: interlock:dev
    container_name: interlock
    restart: unless-stopped
    # Published on the loopback interface only: the demo instance has well-known passwords.
    ports:
      - "127.0.0.1:${INTERLOCK_WEB_PORT:-52773}:52773"
      - "127.0.0.1:${INTERLOCK_SUPERSERVER_PORT:-1972}:1972"
    environment:
      # Empty: the agents replay recorded runs. Set it for live agents (the aihub module).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # live, record or replay; empty lets the instance decide (live when a key is set, else replay).
      - INTERLOCK_AGENT_MODE=${INTERLOCK_AGENT_MODE:-}
      # The model for live agents (default claude-opus-5-5).
      - INTERLOCK_MODEL=${INTERLOCK_MODEL:-}
    volumes:
      # Drop HL7 files here to feed the production by hand; the scenarios do it for you.
      - interlock-mgr:/usr/irissys/mgr/interlock
volumes:
  interlock-mgr:
