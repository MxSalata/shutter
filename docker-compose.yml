# Shutter: `docker compose up -d`, then http://localhost:52773/shutter/index.html (operator / shutter).
# The base image is the contest's irishealth-community:2026.3.0AI.154.0; see the README to load and tag it.
services:
  shutter:
    build:
      context: .
      args:
        IRIS_IMAGE: ${SHUTTER_IMAGE:-irishealth-community:2026.3.0AI.154.0}
        # auto: live agents when the image has AI Hub, the replay edition otherwise; 1 requires AI Hub; 0 skips it.
        WITH_AIHUB: ${SHUTTER_WITH_AIHUB:-auto}
        # Read by the installer at build time (see .env.example); empty keeps the defaults.
        SHUTTER_DEMO_PASSWORD: ${SHUTTER_DEMO_PASSWORD:-}
        SHUTTER_MESSAGE_DAYS: ${SHUTTER_MESSAGE_DAYS:-}
        SHUTTER_MESSAGE_PURGE: ${SHUTTER_MESSAGE_PURGE:-}
        SHUTTER_ESCALATION_DAYS: ${SHUTTER_ESCALATION_DAYS:-}
    image: shutter:dev
    container_name: shutter
    restart: unless-stopped
    # IRIS writes its journal and write image daemon files out before it stops; a longer grace period than Docker's
    # default 10 s lets a busy instance shut down cleanly instead of being killed mid-write.
    stop_grace_period: 2m
    # Healthy once Shutter's production runs: the API's anonymous health route answers "ok": true. `docker compose ps`
    # shows it, and `docker compose up --wait` returns when it is so. The image carries wget, not curl.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:52773/api/shutter/health | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    # Published on the loopback interface only: the demo instance has well-known passwords.
    ports:
      - "127.0.0.1:${SHUTTER_WEB_PORT:-52773}:52773"
      - "127.0.0.1:${SHUTTER_SUPERSERVER_PORT:-1972}:1972"
    environment:
      # Empty: the agents replay recorded runs. Set it for live agents (the aihub module).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # live, record or replay; empty keeps a mode set on the instance, else the instance decides (live when a key is set, else replay).
      - SHUTTER_AGENT_MODE=${SHUTTER_AGENT_MODE:-}
      # The model for live agents (default claude-opus-5-5).
      - SHUTTER_MODEL=${SHUTTER_MODEL:-}
      # Applied when Shutter's production starts (Shutter.Setup.ApplyEnvironment), so they need no build argument and a
      # change takes effect on the next `docker compose up`; empty leaves the instance's setting as it is. See .env.example.
      - SHUTTER_LIVE=${SHUTTER_LIVE:-}
      - SHUTTER_DAILY_BUDGET_USD=${SHUTTER_DAILY_BUDGET_USD:-}
      - SHUTTER_JUDGE_BUDGET_USD=${SHUTTER_JUDGE_BUDGET_USD:-}
      - SHUTTER_DEMO_BUDGET_USD=${SHUTTER_DEMO_BUDGET_USD:-}
      - SHUTTER_DEMO_BUDGET_PERIOD=${SHUTTER_DEMO_BUDGET_PERIOD:-}
      - SHUTTER_LIVE_SCENARIOS=${SHUTTER_LIVE_SCENARIOS:-}
      - SHUTTER_PUBLIC_DEMO_PASSWORD=${SHUTTER_PUBLIC_DEMO_PASSWORD:-}
      - SHUTTER_TRACE_PASSWORD=${SHUTTER_TRACE_PASSWORD:-}
      - SHUTTER_JUDGE_PASSWORD=${SHUTTER_JUDGE_PASSWORD:-}
    volumes:
      # The HL7 folders (drop files into in/ to feed Shutter's production by hand, or into hospital/in/ to feed the
      # demo hospital's; the scenarios do it for you) and, under db/, the data databases of both namespaces: cases,
      # approvals, incidents, the site profile and the provider configuration survive `docker compose down` and `up`,
      # and a rebuilt image brings new code to the same data; after a rebuild, run the install once more inside the new
      # container (docs/INSTALL.md, section 8), so the kept data learns the new items and seeds. `down -v` wipes them.
      - shutter-mgr:/usr/irissys/mgr/shutter
volumes:
  shutter-mgr:
