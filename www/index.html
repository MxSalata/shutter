<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Shutter: failed interface messages investigated by a board of agents, checked by a deterministic gate, approved by a person and verified at the receiver."
    />
    <title>Shutter</title>
    <!-- Applies the stored colour scheme, contrast and palette before the first paint (see public/color-scheme.js). -->
    <script src="/shutter/color-scheme.js"></script>
    <style>
      /* Shown until React's first render replaces #root: a trial page loads its recorded mock first. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #ebeef2;
        color: #495057;
        font:
          500 14px/1.4 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #095c7c, #45acd1);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.15);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-mark::after {
        content: '';
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3.5px solid #fff;
      }
      html[data-mantine-color-scheme='dark'] .boot {
        background: #181e26;
        color: #b3bcc8;
      }
      html[data-shutter-palette='pastel'][data-mantine-color-scheme='light']:not(
          [data-shutter-contrast='high']
        )
        .boot {
        background: #f0ecf9;
        color: #5a5577;
      }
      html[data-shutter-contrast='high'] .boot {
        background: #fff;
        color: #000;
      }
      html[data-shutter-contrast='high'][data-mantine-color-scheme='dark'] .boot {
        background: #000;
        color: #fff;
      }
      /* A trial page (data-shutter-env, set by color-scheme.js before the first paint) opens in the trial's colour */
      .boot-trial {
        display: none;
      }
      html[data-shutter-env='trial'] .boot-live {
        display: none;
      }
      html[data-shutter-env='trial'] .boot-trial {
        display: block;
        color: #862e9c;
        font-weight: 600;
      }
      html[data-shutter-env='trial'] .boot-mark {
        background: linear-gradient(135deg, #862e9c, #cc5de8);
      }
      html[data-shutter-env='trial'][data-mantine-color-scheme='dark'] .boot-trial {
        color: #eebefa;
      }
      html[data-shutter-env='trial'][data-shutter-contrast='high'] .boot-trial {
        color: inherit;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.92);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/shutter/assets/index-Dze5_-gm.js"></script>
    <link rel="modulepreload" crossorigin href="/shutter/assets/react-Be1dNEbh.js">
    <link rel="modulepreload" crossorigin href="/shutter/assets/mantine-D2ogilxe.js">
    <link rel="modulepreload" crossorigin href="/shutter/assets/query-B73i_Fi9.js">
    <link rel="stylesheet" crossorigin href="/shutter/assets/mantine-Ble7_ipu.css">
    <link rel="stylesheet" crossorigin href="/shutter/assets/index-vMHZwtj4.css">
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-mark"></div>
        <div class="boot-live">Loading Shutter…</div>
        <div class="boot-trial">Opening the trial environment</div>
      </div>
    </div>
  </body>
</html>
