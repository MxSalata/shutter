name: CI

# The jobs run on House's own runner (house-runner, a VM with only the internet, the owner's choice of 20 Oct), so CI
# costs no GitHub minutes; it runs one job at a time and keeps Docker images between runs. CI runs on main after a merge, and on a branch only by hand (workflow_dispatch): branch work is tested on House's IRIS
# instances before it is pushed, and the free Actions minutes are kept for main. A push that changes only the docs
# (docs/ and the top-level Markdown) runs nothing; the knowledge's Markdown is checked, so it still runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
  # Dependabot's update pull requests are tested on House's runner before they are merged (the owner, 20 Oct); no
  # other pull request runs, since the runner is the owner's own machine
  pull_request:

# Least privilege by default; the Pages deployment raises what it needs.
permissions:
  contents: read

# One queue per ref, and a newer push cancels the run it replaces, except on main: a run there may be in the middle of a
# dependency release (a commit, a tag, a GitHub release), so every run on main finishes. A run still waiting there is
# replaced by a newer one, which releases the same updates, since the release reads the history since the last version
# tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # InterSystems' own IRIS for Health Community 2026.2, by its tag. InterSystems republishes the tag: on 16 October 2026
  # it moved to a new build and the digest pinned here before disappeared from the registry, so a digest pin breaks
  # the build each time. The community image intersystemsdc/irishealth-community:2026.2 stopped IRIS in CI on the same
  # day: its post-start step (creating the USER namespace through Python) failed on the runner. The official image has
  # no such step.
  IRIS_IMAGE: containers.intersystems.com/intersystems/irishealth-community:2026.2

jobs:
  # The web application: types, lint, format, unit and page tests, the committed www/ build, and axe-core on every
  # screen in every appearance against the demo build. The demo build is kept as an artifact.
  web:
    name: Web application
    runs-on: [self-hosted, house]
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history with its tags: the www/ check looks for dependency updates since the last release.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: www/ is current (IRIS serves the committed build)
        run: |
          npm run build:www
          if [ -z "$(git status --porcelain -- ../www)" ]; then exit 0; fi
          # A dependency update changes the bundle. On Dependabot's pull request the build is checked and the comparison
          # skipped; on main, while npm updates merged since the last version tag are unreleased, the release jobs below
          # commit the rebuilt www/. Everyone else commits www/ with the change. Before the first version tag nothing is
          # skipped on main.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            echo "www/ changes with this dependency update; it is rebuilt and committed when the pull request is merged"
            exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$last" ] &&
            [ -n "$(git log --format=%h --author='dependabot\[bot\]' "$last..HEAD" -- package.json package-lock.json)" ]; then
            echo "www/ changes with the dependency updates merged since $last; the release jobs commit it to main"
            exit 0
          fi
          echo "www/ is stale: run 'npm run build:www' in web/ and commit the result"
          git status --porcelain -- ../www
          exit 1
      # House's runner keeps ~/.cache between jobs, so the browser downloads once and later installs only check it; the
      # system libraries come with it (a GitHub cache restore once reported a hit without the headless shell)
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      # A free port of its own for the demo preview, since runners can share one host
      - name: Accessibility of every screen in every appearance (axe-core, WCAG 2.1 A/AA)
        run: |
          E2E_PORT=$(node -e "const s = require('net').createServer(); s.listen(0, '127.0.0.1', () => { console.log(s.address().port); s.close(); })")
          export E2E_PORT
          npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Build the online demo (recorded runs on the in-browser mock)
        run: npm run build:demo
      # Every run keeps the demo as a plain artifact (unzip and serve with any static server). The Pages artifact and
      # the deployment below are opt-in through the repository variable DEPLOY_DEMO: Pages needs a public repository.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-site
          path: web/dist-demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.DEPLOY_DEMO == 'true' && github.ref == 'refs/heads/main'
        with:
          path: web/dist-demo

  # The board's recorded runs, offline: each file's key, member, agent class and result shape within the schemas the
  # live agents submit, and a full board set for every scenario.
  fixtures:
    name: Recordings and scenarios
    runs-on: [self-hosted, house]
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the writing rules' step reads the messages of every commit a push brings.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Every recording keeps to the schemas, and every scenario has a full board set
        run: |
          set +e
          out=$(python3 scripts/check-records.py fixtures/records --scenarios fixtures/scenarios.json)
          code=$?
          set -e
          echo "$out"
          [ "$code" = "0" ] || exit "$code"
          if echo "$out" | grep -q ': missing '; then echo "A scenario lacks recordings for its board"; exit 1; fi
      - name: The recording checks refuse what they must (their own synthetic recordings)
        run: |
          python3 scripts/check-records.py --self-test
          python3 tests/privacy_check.py --self-test
      # No API key, token or private key in a tracked file or in what the last 20 commits added, and no committed .env
      - name: No credentials in the repository
        run: python3 scripts/secret-scan.py --commits 20
      - name: The scenario catalogue keeps to the condition vocabulary, and catalogue.json is built from it
        run: python3 scripts/build-catalogue.py knowledge/catalogue --check
      # The model gets tokens (MRN-T1, ENC-T1) for the patient's identifiers and never their name, date of birth,
      # address, phone numbers or note text: nothing personal from the fixtures may appear in what a recorded run saw,
      # and no NHS number in it or in the demo's agent output.
      - name: Nothing personal from the fixtures reached the model in any recording
        run: python3 tests/privacy_check.py --demo web/src/mocks/fixtures.json
      # The IPM version equals the release tag, so every place that writes the version holds the same one: both
      # module.xml files (and the aihub module's dependency on the core), Setup.cls, the web package and its lockfile,
      # and the recorded demo's health.version. On a version tag (a run started by hand on the tag) they must also equal
      # the tag.
      - name: The version is the same everywhere it is written
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python3 scripts/check-versions.py --tag "${{ github.ref_name }}"
          else
            python3 scripts/check-versions.py
          fi
      # Open Exchange's reader of module.xml keeps only the low byte of a character, so anything outside ASCII breaks a
      # publish.
      - name: Both module.xml files are plain ASCII
        run: python3 scripts/check-ascii.py module.xml aihub/module.xml
      # The writing rules: no em or en dashes, no tool's name and no Co-Authored-By trailer, in every tracked file but
      # the built www/ and the vendored installer, and in the messages of the commits a push brings.
      - name: The files and the pushed commit messages keep the writing rules
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            python3 scripts/check-text.py --messages "$before..${{ github.sha }}"
          else
            python3 scripts/check-text.py --messages "-1"
          fi
      # The evaluation of the board is made from the recordings, the scenarios and docs/readme/comparison.md, so a change
      # to any of them regenerates it (scripts/evaluate.py). A push of docs alone runs no CI, so regenerate it with the
      # docs change rather than leave it to the next code push.
      - name: The evaluation matches the recordings and the scenarios
        run: python3 scripts/evaluate.py --check
      # The Evaluation page lists what the boundary check tries from docs/readme/boundary.json, which the script writes
      # from its own list
      - name: The Evaluation page lists the boundary check's own checks
        run: python3 tests/e2e/boundary_check.py --check-list docs/readme/boundary.json

  # The ObjectScript side on a real IRIS for Health Community 2026.2 (InterSystems' image; the AI Hub build is not on a
  # registry CI can pull from, and the core needs none of it): the namespace, a full load and compile, the installer,
  # the downstream system's contract tests in process and over HTTP, and every scenario end to end with its recorded
  # runs: S1 to S10, S13, and the withheld merge and cancel (S15, S16) on the board; the two outage scenarios, S11 and
  # S12, and S2 in HL7 2.4 and 2.3.1 (S17, S18) in site-policy mode; S20, a move entered by hand, in rules-only mode;
  # S21, a transfer in the hour the clocks go back, in rules-only and site-policy modes; S22 at two receivers and the
  # occupied bed (S23a to S23c) the resend failsafe (S24) and a site's own segment (S25) in site-policy mode; then the operator's and the
  # approver's routes, the attempts to break the approval boundary, and the production review.
  iris:
    name: IRIS ${{ matrix.shard }} (the downstream system's contract, scenarios in replay)
    runs-on: [self-hosted, house]
    # Three shards, each on its own IRIS, so the scenarios run side by side when several runners are free: the board's
    # scenarios and the routes (which need their cases), the site-policy and rules scenarios, and the in-process tests
    # with the boundary and the production review.
    strategy:
      fail-fast: false
      matrix:
        shard: [board, policy, checks]
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 45
    env:
      # A name of this run's own: runners that share one Docker must never touch another job's container
      CTR: ci-${{ github.run_id }}-${{ github.run_attempt }}-iris-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Docker picks a free host port on the loopback interface, so jobs side by side never compete for one
      - name: Start IRIS with the repository mounted
        run: |
          docker rm -f "$CTR" > /dev/null 2>&1 || true
          docker run -d --name "$CTR" -p 127.0.0.1::52773 -v "$GITHUB_WORKSPACE:/home/irisowner/dev:ro" "$IRIS_IMAGE" \
            --check-caps false --ISCAgent false
          port=$(docker port "$CTR" 52773/tcp | head -1 | sed 's/.*://')
          echo "IRIS_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "IRIS answers on http://127.0.0.1:$port"
      # The official image ships its accounts' passwords expired; the demonstration password SYS stays.
      - name: Wait for IRIS, lift the expired passwords, and wait for the Atelier API
        run: |
          for i in $(seq 1 60); do
            if docker exec "$CTR" iris session IRIS -U %SYS '##class(Security.Users).UnExpireUserPasswords("*")' > /dev/null 2>&1; then
              echo "IRIS took commands after $((i*5)) s"
              break
            fi
            sleep 5
          done
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u _SYSTEM:SYS "$IRIS_URL/api/atelier/" || true)
            if [ "$code" = "200" ]; then echo "IRIS answered after $((i*5)) s"; exit 0; fi
            sleep 5
          done
          echo "The Atelier API did not come up (last HTTP status: '$code')"
          docker logs "$CTR" 2>&1 | tail -80
          exit 1
      # The namespace and the installer run in an IRIS terminal session, as iris.script runs them in the image: IRIS for
      # Health's installer and the production's start write their progress to the current device, which over the SQL
      # route would land in the HTTP response. The result is printed after the call, on a line of its own.
      - name: Create the SHUTTER namespace
        run: |
          python3 scripts/iris-load.py --url "$IRIS_URL" --ns USER src/Shutter/Setup.cls
          out=$(printf '%s\n' 'Set r = ##class(Shutter.Setup).CreateNamespace("SHUTTER") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i "$CTR" iris session IRIS -U USER)
          echo "$out" | tail -20
          echo "$out" | grep -q '^RESULT: ok'
      - name: Load and compile the core, the downstream system and its tests
        run: python3 scripts/iris-load.py --url "$IRIS_URL" --ns SHUTTER src tests/unit/Downstream tests/unit/Shutter
      - name: Install (roles, demo users, web applications, the production)
        run: |
          out=$(printf '%s\n' 'Set r = ##class(Shutter.Setup).Install("/home/irisowner/dev/") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i "$CTR" iris session IRIS -U SHUTTER)
          echo "$out" | tail -30
          echo "$out" | grep -q '^RESULT: ok'
      # The demo hospital (shape A): its own namespace, with Shutter's packages mapped from SHUTTER, and its production,
      # which forwards its failed deliveries to Shutter's intake. Both write their progress to the current device, as
      # above, so they run in terminal sessions too.
      - name: The demo hospital's namespace and production
        run: |
          python3 scripts/iris-load.py --url "$IRIS_URL" --ns SHUTTER Installer.cls
          out=$(printf '%s\n' 'Set r = ##class(Shutter.Installer).RunHospital("SHUTTER") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i "$CTR" iris session IRIS -U SHUTTER)
          echo "$out" | tail -20
          echo "$out" | grep -q '^RESULT: ok'
          out=$(printf '%s\n' 'Set r = ##class(Hospital.Setup).Install("SHUTTER") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i "$CTR" iris session IRIS -U HOSPITAL)
          echo "$out" | tail -20
          echo "$out" | grep -q '^RESULT: ok'
      # The demo records system (v1.25): the demo receiver package in a namespace of its own behind /records/api, the
      # second receiver (category history_of_record) the production feeds beside the bed manager.
      - name: The demo records system's namespace
        run: |
          out=$(printf '%s\n' 'Set r = ##class(Shutter.Installer).RunRecords("SHUTTER") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i "$CTR" iris session IRIS -U SHUTTER)
          echo "$out" | tail -20
          echo "$out" | grep -q '^RESULT: ok'
      - name: The downstream system's contract tests, in process
        if: matrix.shard == 'checks'
        run: |
          out=$(python3 scripts/iris-sql.py --url "$IRIS_URL" --ns SHUTTER --json "SELECT Downstream_Test.Run_Contract() AS r")
          echo "$out"
          echo "$out" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)[0]["r"]
          r = json.loads(r) if isinstance(r, str) else r
          sys.exit(0 if r["failed"] == 0 and r["passed"] > 0 else 1)'
      # The trigger table, merges and cancels, the gate's checks, the matcher's conditions, supersession, the model view
      # and the case's writes
      - name: Shutter's unit tests, in process
        if: matrix.shard == 'checks'
        run: |
          out=$(python3 scripts/iris-sql.py --url "$IRIS_URL" --ns SHUTTER --json "SELECT Shutter_Test.Run_Triggers() AS r")
          echo "$out"
          echo "$out" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)[0]["r"]
          r = json.loads(r) if isinstance(r, str) else r
          sys.exit(0 if r.get("failed") == 0 and r.get("passed", 0) > 0 else 1)'
      - name: The downstream system's API over HTTP
        if: matrix.shard == 'board'
        run: python3 tests/e2e/downstream_api_check.py --url "$IRIS_URL" --second-user downstream-client --second-password shutter
      - name: Scenarios S1 to S10, S13, S15 and S16 end to end on the board, in replay
        if: matrix.shard == 'board'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --approve S1 S2 S3 S4 S5 S6 S7 S8 S9 S10 S13 S15 S16
      # The board's runs of the seven newer scenarios, recorded live on 1 November 2026: the transfer in the hour the clocks
      # go back (S21), one overtaken transfer at two receivers, each with its own recording (S22), the occupied bed resent
      # once its occupant has left (S23a), two patients for one bed (S23b) and the occupant who cannot leave (S23c), the
      # newer message on its way, which the board's plan waits for (S24), and the message with the site's own segment (S25)
      - name: S21 to S25 end to end on the board, in replay
        if: matrix.shard == 'board'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes board --approve S21 S22 S23a S23b S23c S24 S25
      # What the model would see of a case: tokens for the hospital number and the visit number, never the values, and
      # never the NHS number PID-3 carries beside the hospital number.
      - name: The model's view of a case carries tokens, not identifiers
        if: matrix.shard == 'board'
        run: |
          out=$(python3 scripts/iris-sql.py --url "$IRIS_URL" --ns SHUTTER --json "SELECT Shutter_Util.ModelView_Preview('C-000001') AS p")
          echo "$out" | head -40
          echo "$out" | grep -q 'MRN-T1'
          echo "$out" | grep -q 'ENC-T1'
          if echo "$out" | grep -Eq 'MRN1001|ENC-1001|9991001018'; then echo "A real identifier reached the model's view"; exit 1; fi
      # Times without an offset are read in the feed's zone: British Summer Time in July, GMT in January, and the hour
      # before the October clock change flagged.
      - name: Event times in the feed's time zone
        if: matrix.shard == 'board'
        run: |
          out=$(python3 scripts/iris-sql.py --url "$IRIS_URL" --ns SHUTTER --json "SELECT Shutter_Util.Time_Probe('20260715094500', 'Europe/London') AS summer, Shutter_Util.Time_Probe('20260115094500', 'Europe/London') AS winter, Shutter_Util.Time_Probe('20261025013000', 'Europe/London') AS change, Shutter_Util.Time_Probe('20260715094500+0200', 'Europe/London') AS offset, Shutter_Util.Time_Probe('20260715094500', 'UTC') AS utc")
          echo "$out"
          echo "$out" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)[0]
          r = {k: json.loads(v) if isinstance(v, str) else v for k, v in r.items()}
          assert r["summer"]["iso"] == "2026-07-15T08:45:00Z", r["summer"]
          assert r["winter"]["iso"] == "2026-01-15T09:45:00Z", r["winter"]
          assert r["change"]["near_clock_change"] is True, r["change"]
          assert r["summer"]["near_clock_change"] is False, r["summer"]
          assert r["offset"]["iso"] == "2026-07-15T07:45:00Z" and r["offset"]["had_offset"] is True, r["offset"]
          assert r["utc"]["iso"] == "2026-07-15T09:45:00Z", r["utc"]'
      # An outage opens an incident: each patient's chain is checked for its kind, who decided it, its catalogue
      # entries, its writes and the downstream system's final state.
      - name: The outage scenarios S11 and S12 in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S11 S12
      # The fields Shutter reads sit at the same positions in HL7 2.3.1, 2.4 and 2.5.1
      - name: S2 in HL7 2.4 and 2.3.1 (S17, S18) in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S17 S18
      # Shape A: the transfer fails in the demo hospital's own production, its forwarder hands the case to Shutter, and
      # the case names its source
      - name: S2 in the demo hospital's production (S19) in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S19
      # A nurse moves the patient by hand in the downstream system while the resend waits for approval: the approval is
      # bound to the receiver's version, so the dispatch stops, the case is planned again, and her entry stands
      - name: A move entered by hand while the resend awaits approval (S20) in rules-only mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes rules --approve S20
      # A transfer timed 01:30 with no offset on the night the clocks go back, an hour that happens twice: site policy
      # escalates it on E13, and the resend rules alone propose is blocked by the gate (EVENT_TIME_IMPLAUSIBLE)
      - name: A transfer in the hour the clocks go back (S21) in rules-only and site-policy modes
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes rules,policy --approve S21
      # The same overtaken transfer fails at the bed manager and at the patient records system: the bed manager's case
      # closes superseded with no write, the records system's escalates with the steps that correct its history
      - name: One overtaken transfer at two receivers (S22) in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S22
      # A transfer into a bed another patient holds: resent once the occupant has left (S23a), escalated when two
      # patients are allocated to one bed (S23b), and escalated when the occupant's own case cannot free the bed (S23c)
      - name: The occupied bed (S23a, S23b, S23c) in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S23a S23b S23c
      # A newer transfer is on its way to a slow receiver as the resend is due: the case waits for it
      # (NEWER_MESSAGE_PENDING), the newer transfer lands, and the case closes superseded with nothing written (S24)
      - name: A newer message on its way as Shutter resends (S24) in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S24
      # A transfer whose delivery failed carries the site's own Z segment, which the namespace's schema doesn't define: the
      # gate blocks the resend (PARSE_FAILED), with the Second Parser's verdict where Java is present (S25)
      - name: A message with the site's own segment (S25) in site-policy mode
        if: matrix.shard == 'policy'
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S25
      # The roles over HTTP: the library is the approver's to change, an operator escalates a case and closes it by hand,
      # and under the site profile's two-person rule only an approver closes it. It closes two of the cases the
      # scenarios left escalated or blocked, so it runs after them.
      - name: The operator's and the approver's routes
        if: matrix.shard == 'board'
        run: python3 tests/e2e/roles_check.py --url "$IRIS_URL"
      # Tries to break the approval boundary: another plan digest, a stale case version, an operator's approval and one
      # approval sent twice with its key then reused (S2), the receiving system changed after the approval (S20), and a
      # resend of a delivery the receiver already holds (S3), each refused with nothing written. It plays its own
      # scenarios in rules-only mode, so it runs after the roles check, which needs the cases the scenarios above left.
      - name: What the approval boundary refuses
        if: matrix.shard == 'checks'
        run: python3 tests/e2e/boundary_check.py --url "$IRIS_URL"
      # The production review of both productions, read-only: the demo's findings, the fingerprint stable across two
      # runs, an approver's annotation seen by a fresh review and revoked, and the agent's part with no recording. It runs
      # after the scenarios, whose failed deliveries are the window's errors.
      - name: The production review of Shutter's production and the hospital's
        if: matrix.shard == 'checks'
        run: python3 tests/e2e/review_check.py --url "$IRIS_URL"
      # Every case the shard played, from the message warehouse: no write before the gate and a rehearsal, an approval
      # before the write where one case holds the session, the board before the gate, every resolved resend verified
      - name: Every case's lineage in the message warehouse
        run: python3 tests/e2e/lineage_check.py --url "$IRIS_URL"
      # The scenarios fail deliveries on purpose (the routing processes log those); a runtime error in Shutter's own code
      # (<UNDEFINED>, a class or property that does not exist, ERROR #5002) must never appear
      - name: No runtime error in the productions' Event Log
        run: python3 tests/e2e/eventlog_check.py --url "$IRIS_URL" --ns SHUTTER,HOSPITAL
      - name: Readiness report and the IRIS log
        if: always()
        run: |
          python3 scripts/iris-sql.py --url "$IRIS_URL" --ns SHUTTER "SELECT Shutter.Setup_Doctor() AS r" || true
          docker logs "$CTR" 2>&1 | tail -80 || true
      - name: Remove the IRIS container
        if: always()
        run: docker rm -f "$CTR" > /dev/null 2>&1 || true

  # Merged Dependabot pull requests change the bundle but not the committed www/, which IRIS serves and the IPM package
  # and the image ship. These two jobs make them a patch release. They run on every push to main and read the history,
  # not the push: the Dependabot commits since the last version tag are the unreleased updates, however many pull
  # requests were merged together and whichever runs a newer push replaced. Until the first version tag (v1.0.0, made
  # when the owner releases on Open Exchange) they do nothing. When any of the updates changed
  # web/package.json or web/package-lock.json, the last figure of the version moves in every place
  # scripts/check-versions.py knows (both module.xml files, the aihub module's dependency on the core, Setup.cls, the
  # web package and its lockfile, the recorded demo's health.version), the CHANGELOG gets a section naming every update
  # (scripts/dependency-release.mjs), www/ is rebuilt, and the commit is pushed to main with its annotated tag and a
  # GitHub release; the image job then builds from that commit. Open Exchange's "Release app" with the same version
  # publishes it to the package manager: that stays the owner's step, so the IPM version follows the tag. Updates to
  # workflows alone bump nothing (the next release names them). Pull requests never reach these jobs, so no run that
  # Dependabot starts holds a write token. A push made with GITHUB_TOKEN starts no workflow, so the commit is checked
  # by the next push.
  #
  # The first job runs the updated packages (npm ci, the build) with a read-only token that it does not keep, and hands
  # its commit over as a git bundle; the second holds the write token and runs no package code: it checks the commit
  # touches only the release's files, and the versioned files only in their version, then pushes, tags and releases
  # it. Both work on this push's commit, never a newer one, and when main has moved on the release is left to the run
  # for the newer push, so nothing is published that its own checks have not passed. The second runs on a fresh
  # GitHub-hosted runner, not House's: House's runner keeps its home folder and tools between jobs, so package code the
  # first job ran there could change what the push runs with the write token. It runs only once a version tag exists,
  # when the repository is public and a GitHub-hosted runner costs no minutes.
  dependency-release-build:
    needs: [web, fixtures, iris]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, house]
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history with its tags, back to the last release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Make the dependency updates since the last release a patch release, with www/ rebuilt
        id: build
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)
          if [ -z "$last" ]; then
            echo "No version tag yet: nothing to release"
            exit 0
          fi
          dependabot_since() { git log --format=%h --author='dependabot\[bot\]' "$last..HEAD" "$@"; }
          if [ -z "$(dependabot_since)" ]; then
            echo "No Dependabot commit since $last: nothing to release"
            exit 0
          fi
          (cd web && npm ci)
          version=""
          if [ -n "$(dependabot_since -- web/package.json web/package-lock.json)" ]; then
            current=$(python3 scripts/check-versions.py --print)
            version="${current%.*}.$((${current##*.} + 1))"
            python3 scripts/check-versions.py --set "$version"
            node scripts/dependency-release.mjs "$version" "$last" > release-notes.md
          fi
          (cd web && npm run build:www)
          if [ -z "$version" ] && [ -z "$(git status --porcelain -- www)" ]; then
            echo "No npm update since $last and www/ current: nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A www
          if [ -n "$version" ]; then
            git add module.xml aihub/module.xml src/Shutter/Setup.cls web/package.json web/package-lock.json \
              web/src/mocks/fixtures.json CHANGELOG.md
            # The subject, a blank line, then the notes: git takes -m or -F, not both.
            { printf '%s\n\n' "$version: dependency updates"; cat release-notes.md; } | git commit -F -
          else
            git commit -m "www/ rebuilt for the dependency update"
          fi
          mkdir -p "$RUNNER_TEMP/release"
          git bundle create "$RUNNER_TEMP/release/release.bundle" "$GITHUB_SHA..HEAD"
          [ -z "$version" ] || cp release-notes.md "$RUNNER_TEMP/release/"
          echo "commit=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outputs.commit == 'true'
        with:
          name: dependency-release
          path: ${{ runner.temp }}/release
          retention-days: 1

  www-after-dependabot-merge:
    needs: dependency-release-build
    if: needs.dependency-release-build.outputs.commit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-release
          path: ${{ runner.temp }}/release
      - name: Push the release commit with its tag and GitHub release
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.dependency-release-build.outputs.version }}
        run: |
          release="$RUNNER_TEMP/release"
          # This push's own scripts/check-versions.py, which the bundle cannot change: it runs here on the commit's files.
          check="$PWD/scripts/check-versions.py"
          git fetch -q "$release/release.bundle" HEAD
          commit=$(git rev-parse FETCH_HEAD)
          # One commit on this push's, touching only what a dependency release changes.
          if [ "$(git rev-list --count "$GITHUB_SHA..$commit")" != 1 ] || [ "$(git rev-parse "$commit^")" != "$GITHUB_SHA" ]; then
            echo "The bundle is not one commit on $GITHUB_SHA"; exit 1
          fi
          versioned='module.xml aihub/module.xml src/Shutter/Setup.cls web/package.json web/package-lock.json web/src/mocks/fixtures.json'
          other=$(git diff --name-only "$GITHUB_SHA" "$commit" \
            | grep -vxE 'www/.*|module\.xml|aihub/module\.xml|src/Shutter/Setup\.cls|web/package(-lock)?\.json|web/src/mocks/fixtures\.json|CHANGELOG\.md' || true)
          if [ -n "$other" ]; then echo "The release commit changes other files:"; echo "$other"; exit 1; fi
          # The build ran package code, so the versioned files may differ only in their version ($versioned is split on
          # purpose: one path per word).
          if [ -z "$VERSION" ] && ! git diff --quiet "$GITHUB_SHA" "$commit" -- $versioned CHANGELOG.md; then
            echo "A www/ rebuild changes files outside www/"; exit 1
          fi
          same() { cmp -s <(git show "$GITHUB_SHA:$1" | python3 "$check" --blank "$1") <(git show "$commit:$1" | python3 "$check" --blank "$1"); }
          for f in $versioned; do
            if ! same "$f"; then echo "The release commit changes $f beyond the version"; exit 1; fi
          done
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "'$VERSION' is not a version"; exit 1; fi
            tree=$(mktemp -d)
            git worktree add -q --detach "$tree" "$commit"
            carried=yes
            python3 "$check" --root "$tree" --tag "v$VERSION" || carried=no
            # The worktree goes either way, so a failed check leaves nothing behind.
            git worktree remove --force "$tree"
            if [ "$carried" = no ]; then echo "The release commit does not carry version '$VERSION' everywhere"; exit 1; fi
          fi
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has moved on since this push: the run for the newer push releases these updates"
            exit 0
          fi
          if [ -n "$VERSION" ]; then
            command -v gh > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q gh; }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "v$VERSION" -m "Shutter $VERSION: dependency updates" "$commit"
            # Atomic: if main moved in the meantime, neither main nor the tag changes.
            git push --atomic origin "$commit:refs/heads/main" "v$VERSION"
            gh release create "v$VERSION" --title "Shutter $VERSION" --notes-file "$release/release-notes.md"
            echo "Released $VERSION from the dependency updates"
          else
            git push origin "$commit:refs/heads/main"
            echo "Committed the rebuilt www/ to main"
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

  # The judges' path: the Dockerfile, its build script and the IPM module, built from the public IRIS for Health
  # Community 2026.2 image (the contest's AI Hub build is not on a registry CI can pull from), then started as
  # `docker compose up` would start it, with scenario S2 played end to end on it.
  # After a dependency release it builds the release commit; when the release jobs are skipped (a pull request, a branch,
  # no update to release) it builds this run's commit.
  image:
    name: Image (Dockerfile, iris.script, the IPM module)
    needs: [dependency-release-build, www-after-dependabot-merge]
    runs-on: [self-hosted, house]
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'dependabot[bot]')
      && (needs.dependency-release-build.result == 'success' || needs.dependency-release-build.result == 'skipped')
      && (needs.www-after-dependabot-merge.result == 'success' || needs.www-after-dependabot-merge.result == 'skipped') }}
    timeout-minutes: 30
    env:
      CTR: ci-${{ github.run_id }}-${{ github.run_attempt }}-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.www-after-dependabot-merge.outputs.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # A plain build: the Dockerfile copies the whole repository before installing, so every commit changes every layer
      # after the base, and a layer cache (buildx with the GitHub Actions cache, tried on 20 Oct) saved nothing and ran
      # the runner out of disk keeping a second copy of the image. The public base has no AI Hub package, so the image
      # gets the core (replay) edition: WITH_AIHUB=0. PEX_STRICT=1 fails the build if the Second Parser can't be built
      # here, so the 2026.2 path stays checked; a judge's build skips it with the reason instead.
      - name: Build the image from the public base
        run: >-
          docker build --progress plain
          --build-arg IRIS_IMAGE="$IRIS_IMAGE"
          --build-arg WITH_AIHUB=0
          --build-arg PEX_STRICT=1
          -t "shutter:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .
      - name: Start it
        # The startup alerts are cleared by the production's own start; no after-start script is needed. The container and
        # the image carry this run's id, and Docker picks the host port, so jobs that share one Docker never collide.
        run: |
          docker rm -f "$CTR" > /dev/null 2>&1 || true
          docker run -d --name "$CTR" -p 127.0.0.1::52773 "shutter:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --check-caps false --ISCAgent false
          port=$(docker port "$CTR" 52773/tcp | head -1 | sed 's/.*://')
          echo "IRIS_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
      - name: Wait for the web application
        run: |
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' $IRIS_URL/shutter/index.html || true)
            if [ "$code" = "200" ]; then echo "The web application answered after $((i*5)) s"; exit 0; fi
            sleep 5
          done
          echo "The web application did not come up (last HTTP status: '$code')"
          docker logs "$CTR" 2>&1 | tail -100
          exit 1
      - name: Scenario S2 end to end on the built image
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --approve S2
      # The image installs the demo hospital at build time (iris.script) and starts its production with the instance
      - name: Scenario S19 through the built image's demo hospital
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --modes policy --approve S19
      # The six settings a public demo sets in .env reach a running container as its environment, never as build args,
      # and the production's start applies them (CONTRACTS 4.4, 9 and 12): the same image started again with them must
      # have the judge and demo users, the day's cap and the judge's share, and the live hospital on. A separate start,
      # after S2 and S19, since the live hospital's player begins its stories within a minute. Fixed test passwords.
      - name: The runtime settings reach the instance (live hospital, budget, demo and judge users)
        env:
          SHUTTER_LIVE: '1'
          SHUTTER_DAILY_BUDGET_USD: '5'
          SHUTTER_JUDGE_BUDGET_USD: '1'
          SHUTTER_PUBLIC_DEMO_PASSWORD: ci-demo-pw-71
          SHUTTER_TRACE_PASSWORD: ci-trace-pw-72
          SHUTTER_JUDGE_PASSWORD: ci-judge-pw-73
        run: |
          # docker-compose.yml passes each of the six to the container
          docker compose config --format json | python3 -c '
          import json, os, sys
          env = json.load(sys.stdin)["services"]["shutter"].get("environment") or {}
          names = ["SHUTTER_LIVE", "SHUTTER_DAILY_BUDGET_USD", "SHUTTER_JUDGE_BUDGET_USD",
                   "SHUTTER_PUBLIC_DEMO_PASSWORD", "SHUTTER_TRACE_PASSWORD", "SHUTTER_JUDGE_PASSWORD"]
          missing = [n for n in names if env.get(n) != os.environ[n]]
          sys.exit("docker-compose.yml does not pass " + ", ".join(missing) if missing else 0)'
          docker rm -f "$CTR" > /dev/null 2>&1 || true
          docker run -d --name "$CTR" -p 127.0.0.1::52773 \
            -e SHUTTER_LIVE -e SHUTTER_DAILY_BUDGET_USD -e SHUTTER_JUDGE_BUDGET_USD \
            -e SHUTTER_PUBLIC_DEMO_PASSWORD -e SHUTTER_TRACE_PASSWORD -e SHUTTER_JUDGE_PASSWORD \
            "shutter:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --check-caps false --ISCAgent false
          port=$(docker port "$CTR" 52773/tcp | head -1 | sed 's/.*://')
          url="http://127.0.0.1:$port/api/shutter"
          # The production applies them at its start, the hospital's switch from a job once that production runs too
          check() {
            JUDGE=$(curl -s -u "judge:$SHUTTER_JUDGE_PASSWORD" "$url/me" || true) \
            DEMO=$(curl -s -u "demo:$SHUTTER_PUBLIC_DEMO_PASSWORD" "$url/me" || true) \
            SETTINGS=$(curl -s -u operator:shutter "$url/settings" || true) \
            python3 -c '
          import json, os, sys
          def read(name):
              try:
                  return json.loads(os.environ[name])
              except ValueError:
                  return {}
          judge, demo, s = read("JUDGE"), read("DEMO"), read("SETTINGS")
          budget, live = s.get("budget") or {}, s.get("live") or {}
          wrong = [what for what, good in [
              ("judge /me can.liveAgents", (judge.get("can") or {}).get("liveAgents") is True),
              ("demo /me can.liveAgents", (demo.get("can") or {}).get("liveAgents") is False),
              ("budget.dailyUsd 5", budget.get("dailyUsd") == 5),
              ("budget.perUserUsd 1", budget.get("perUserUsd") == 1),
              ("live.enabled", live.get("enabled") is True)] if not good]
          if wrong and len(sys.argv) > 1:
              print("not yet: " + ", ".join(wrong))
              print("budget:", json.dumps(budget), "live:", json.dumps(live))
          sys.exit(1 if wrong else 0)' "$@"
          }
          ok=
          for i in $(seq 1 60); do
            if check; then ok=1; echo "Applied after $((i*5)) s"; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { check verbose; exit 1; }
          # The production's own log says what it applied
          python3 scripts/iris-sql.py --url "http://127.0.0.1:$port" --ns SHUTTER \
            "SELECT TOP 1 Text FROM Ens_Util.Log WHERE Text %STARTSWITH 'The environment was applied' ORDER BY ID DESC" \
            | tee /dev/stderr | grep -q 'The environment was applied'
      - name: IRIS log
        if: always()
        run: docker logs "$CTR" 2>&1 | tail -100 || true
      - name: Remove the container
        if: always()
        run: |
          docker rm -f "$CTR" > /dev/null 2>&1 || true
          docker image rm "shutter:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > /dev/null 2>&1 || true

  # Publishes the demo to GitHub Pages. Skipped (not failed) until the repository is public, Pages is enabled
  # (Settings, Pages, Source: GitHub Actions) and the repository variable DEPLOY_DEMO is 'true'. The four checks are
  # named in the condition: the release jobs before the image are skipped on most runs, and a skipped job further up
  # would otherwise skip this one too.
  deploy-demo:
    if: >-
      ${{ !cancelled() && needs.web.result == 'success' && needs.fixtures.result == 'success'
      && needs.iris.result == 'success' && needs.image.result == 'success'
      && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DEMO == 'true' }}
    needs: [web, fixtures, iris, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages deployments must never be interrupted, so this job keeps its own serial queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
