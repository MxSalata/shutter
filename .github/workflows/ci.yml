name: CI

on:
  push:
    branches: [main, 'core/**', 'house/**']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the Pages deployment raises what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # InterSystems' own IRIS for Health Community 2026.2, by its tag. InterSystems republishes the tag: on 16 October 2026
  # it moved to a new build and the digest pinned here before disappeared from the registry, so a digest pin breaks
  # the build each time. The community image intersystemsdc/irishealth-community:2026.2 stopped IRIS in CI on the same
  # day: its post-start step (creating the USER namespace through Python) failed on the runner. The official image has
  # no such step.
  IRIS_IMAGE: containers.intersystems.com/intersystems/irishealth-community:2026.2

jobs:
  # The web application: types, lint, format, unit and page tests, the committed www/ build, and axe-core on every
  # screen in every appearance against the demo build. The demo build is kept as an artifact.
  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: www/ is current (IRIS serves the committed build)
        run: |
          npm run build:www
          if [ -n "$(git status --porcelain -- ../www)" ]; then
            echo "www/ is stale: run 'npm run build:www' in web/ and commit the result"
            git status --porcelain -- ../www
            exit 1
          fi
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility of every screen in every appearance (axe-core, WCAG 2.1 A/AA)
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Build the online demo (recorded runs on the in-browser mock)
        run: npm run build:demo
      # Every run keeps the demo as a plain artifact (unzip and serve with any static server). The Pages artifact and
      # the deployment below are opt-in through the repository variable DEPLOY_DEMO: Pages needs a public repository.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-site
          path: web/dist-demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.DEPLOY_DEMO == 'true' && github.ref == 'refs/heads/main'
        with:
          path: web/dist-demo

  # The board's recorded runs, offline: each file's key, member, agent class and result shape within the schemas the
  # live agents submit, and a full board set for every scenario.
  fixtures:
    name: Recordings and scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every recording keeps to the schemas, and every scenario has a full board set
        run: |
          set +e
          out=$(python3 scripts/check-records.py fixtures/records --scenarios fixtures/scenarios.json)
          code=$?
          set -e
          echo "$out"
          [ "$code" = "0" ] || exit "$code"
          if echo "$out" | grep -q ': missing '; then echo "A scenario lacks recordings for its board"; exit 1; fi

  # The ObjectScript side on a real IRIS for Health Community 2026.2 (InterSystems' image; the AI Hub build is not on a
  # registry CI can pull from, and the core needs none of it): the namespace, a full load and compile, the installer,
  # the ward's contract tests in process and over HTTP, and scenarios S1 to S3 end to end with their recorded runs.
  iris:
    name: IRIS (the ward's contract, scenarios in replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IRIS_URL: http://localhost:52773
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start IRIS with the repository mounted
        run: >-
          docker run -d --name iris -p 52773:52773 -v "$GITHUB_WORKSPACE:/home/irisowner/dev:ro" "$IRIS_IMAGE"
          --check-caps false --ISCAgent false
      # The official image ships its accounts' passwords expired; the demonstration password SYS stays.
      - name: Wait for IRIS, lift the expired passwords, and wait for the Atelier API
        run: |
          for i in $(seq 1 60); do
            if docker exec iris iris session IRIS -U %SYS '##class(Security.Users).UnExpireUserPasswords("*")' > /dev/null 2>&1; then
              echo "IRIS took commands after $((i*5)) s"
              break
            fi
            sleep 5
          done
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u _SYSTEM:SYS "$IRIS_URL/api/atelier/" || true)
            if [ "$code" = "200" ]; then echo "IRIS answered after $((i*5)) s"; exit 0; fi
            sleep 5
          done
          echo "The Atelier API did not come up (last HTTP status: '$code')"
          docker logs iris 2>&1 | tail -80
          exit 1
      # The namespace and the installer run in an IRIS terminal session, as iris.script runs them in the image: IRIS for
      # Health's installer and the production's start write their progress to the current device, which over the SQL
      # route would land in the HTTP response. The result is printed after the call, on a line of its own.
      - name: Create the INTERLOCK namespace
        run: |
          python3 scripts/iris-load.py --url "$IRIS_URL" --ns USER src/Interlock/Setup.cls
          out=$(printf '%s\n' 'Set r = ##class(Interlock.Setup).CreateNamespace("INTERLOCK") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i iris iris session IRIS -U USER)
          echo "$out" | tail -20
          echo "$out" | grep -q '^RESULT: ok'
      - name: Load and compile the core, the ward system and its tests
        run: python3 scripts/iris-load.py --url "$IRIS_URL" --ns INTERLOCK src tests/unit/Wards
      - name: Install (roles, demo users, web applications, the production)
        run: |
          out=$(printf '%s\n' 'Set r = ##class(Interlock.Setup).Install("/home/irisowner/dev/") Write !,"RESULT: ",r,!' 'Halt' \
            | docker exec -i iris iris session IRIS -U INTERLOCK)
          echo "$out" | tail -30
          echo "$out" | grep -q '^RESULT: ok'
      - name: The ward's contract tests, in process
        run: |
          out=$(python3 scripts/iris-sql.py --url "$IRIS_URL" --ns INTERLOCK --json "SELECT Wards_Test.Run_Contract() AS r")
          echo "$out"
          echo "$out" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)[0]["r"]
          r = json.loads(r) if isinstance(r, str) else r
          sys.exit(0 if r["failed"] == 0 and r["passed"] > 0 else 1)'
      - name: The ward's API over HTTP
        run: python3 tests/e2e/ward_api_check.py --url "$IRIS_URL" --second-user wards-client --second-password interlock
      - name: Scenarios S1 to S3 end to end in replay (superseded, resend after approval, reconcile)
        run: python3 tests/e2e/scenario_check.py --url "$IRIS_URL" --approve S1 S2 S3
      - name: Readiness report and the IRIS log
        if: always()
        run: |
          python3 scripts/iris-sql.py --url "$IRIS_URL" --ns INTERLOCK "SELECT Interlock.Setup_Doctor() AS r" || true
          docker logs iris 2>&1 | tail -80 || true

  # The judges' path: the Dockerfile, its build script and the IPM module, built from the public IRIS for Health
  # Community 2026.2 image (the contest's AI Hub build is not on a registry CI can pull from), then started as
  # `docker compose up` would start it, with scenario S2 played end to end on it.
  image:
    name: Image (Dockerfile, iris.script, the IPM module)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image from the public base
        # The public base has no AI Hub package, so the image gets the core (replay) edition: WITH_AIHUB=0.
        run: >-
          docker build --progress plain
          --build-arg IRIS_IMAGE="$IRIS_IMAGE"
          --build-arg WITH_AIHUB=0
          -t interlock:ci .
      - name: Start it
        # The startup alerts are cleared by the production's own start; no after-start script is needed.
        run: >-
          docker run -d --name interlock -p 52773:52773 interlock:ci
          --check-caps false --ISCAgent false
      - name: Wait for the web application
        run: |
          code=
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:52773/interlock/index.html || true)
            if [ "$code" = "200" ]; then echo "The web application answered after $((i*5)) s"; exit 0; fi
            sleep 5
          done
          echo "The web application did not come up (last HTTP status: '$code')"
          docker logs interlock 2>&1 | tail -100
          exit 1
      - name: Scenario S2 end to end on the built image
        run: python3 tests/e2e/scenario_check.py --url http://localhost:52773 --approve S2
      - name: IRIS log
        if: always()
        run: docker logs interlock 2>&1 | tail -100 || true

  # Publishes the demo to GitHub Pages. Skipped (not failed) until the repository is public, Pages is enabled
  # (Settings, Pages, Source: GitHub Actions) and the repository variable DEPLOY_DEMO is 'true'.
  deploy-demo:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DEMO == 'true'
    needs: [web, fixtures, iris, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages deployments must never be interrupted, so this job keeps its own serial queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
